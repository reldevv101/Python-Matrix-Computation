[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-computation-benchmark"
version = "0.1.0"
description = "Sequential matrix multiplication benchmark"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
matrix-benchmark = "matrix_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
